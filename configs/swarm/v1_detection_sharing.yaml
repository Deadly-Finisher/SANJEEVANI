swarm:
  name: "v1_three_drone_swarm"

input:
  drone_detection_logs:
    - drone_id: "drone_1"
      detection_csv: "outputs/swarm/camera_tests/drone_1/detections.csv"

    - drone_id: "drone_2"
      detection_csv: "outputs/swarm/camera_tests/drone_2/detections.csv"

    - drone_id: "drone_3"
      detection_csv: "outputs/swarm/camera_tests/drone_3/detections.csv"

output:
  output_dir: "outputs/swarm/v1_three_drone_swarm"
  shared_detection_csv: "shared_detections.csv"
  shared_summary_json: "shared_detection_summary.json"
  shared_report_md: "shared_detection_report.md"

sharing:
  confidence_threshold: 0.25
  keep_original_labels: true
  duplicate_time_window_s: 1.0
