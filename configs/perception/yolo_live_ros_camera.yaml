model:
  name: "yolo11n.pt"
  confidence_threshold: 0.30
  image_size: 640
  device: "cpu"

input:
  ros_image_topic: "/world/battlefield_sar_world_v1/model/x500_mono_cam_0/link/camera_link/sensor/camera/image"

output:
  csv_path: "outputs/live_yolo/detections.csv"
  annotated_frame_dir: "outputs/live_yolo/annotated_frames"
  save_annotated_frames: true
  save_every_n_detections: 5

runtime:
  inference_every_n_frames: 2
  display_window: true
  window_name: "Live Drone YOLO Detection"