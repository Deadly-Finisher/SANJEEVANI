input:
  ros_image_topic: /world/battlefield_sar_world_v1_realistic/model/x500_mono_cam_3/link/camera_link/sensor/camera/image
models:
- model_name: general_coco
  weights_path: yolo11n.pt
  confidence_threshold: 0.25
  image_size: 640
  enabled: true
- model_name: aerial_safe_objects
  weights_path: models/aerial_safe_objects/best_aerial_safe_objects.pt
  confidence_threshold: 0.25
  image_size: 640
  enabled: true
- model_name: fire_smoke
  weights_path: models/fire_smoke/best_fire_smoke.pt
  confidence_threshold: 0.25
  image_size: 640
  enabled: true
- model_name: drone_view_general
  weights_path: models/drone_view_general/best_drone_view_general.pt
  confidence_threshold: 0.25
  image_size: 640
  enabled: true
stream:
  host: 0.0.0.0
  port: 5013
  jpeg_quality: 80
output:
  csv_path: outputs/swarm/camera_tests/drone_3/detections.csv
  annotated_frame_dir: outputs/swarm/camera_tests/drone_3/annotated_frames
  save_annotated_frames: true
  save_every_n_frames: 5
runtime:
  inference_every_n_frames: 2
server:
  host: 0.0.0.0
  port: 5013
mjpeg:
  host: 0.0.0.0
  port: 5013
