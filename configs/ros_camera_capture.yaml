camera:
  ros_topic: "/world/default/model/x500_mono_cam_0/link/camera_link/sensor/camera/image"
  max_frames: 10
  save_every_n_frames: 1

output:
  output_dir: "outputs/camera_frames"
  frames_dir: "raw"
  metadata_csv: "camera_frame_metadata.csv"
  summary_file: "camera_capture_summary.txt"

safety:
  allow_targeting: false
  allow_autonomous_engagement: false
  human_review_required: true
